<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Arrange the World</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Three Strange Places</h1>
      <a href="#">Begin Exploring</a>
    </header>

    <main>
      <section class="places">
        <article class="place">
          <h2>The Forest</h2>
          <p>
            Every tree grows toward the center, although no one knows what is
            there.
          </p>
        </article>

        <article class="place">
          <h2>The Island</h2>
          <p>
            It appears on maps drawn from memory, but never on maps drawn from
            observation.
          </p>
        </article>

        <article class="place">
          <h2>The Tower</h2>
          <p>It has seven windows from the outside and eight from within.</p>
        </article>
      </section>
    </main>
  </body>
</html>
